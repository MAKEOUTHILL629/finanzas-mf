<section class="erp-page" aria-labelledby="titulo-cruces">
  <header class="erp-header">
    <div>
      <button type="button" class="erp-back" routerLink="/estado-cuenta">
        <i class="material-icons" aria-hidden="true">arrow_back</i>
        Estado de cuenta
      </button>
      <h1 id="titulo-cruces">Cruces de deuda</h1>
      <p class="erp-subtitle">Cuando una persona paga lo que debe otra: la base de datos mueve la deuda de una a la otra automáticamente.</p>
    </div>
    <div class="erp-actions">
      <app-acciones [principal]="principal" (accion)="alAccionar($event)"></app-acciones>
    </div>
  </header>

  <app-filter-bar placeholder="Buscar por concepto, persona o monto…" [filtros]="[]" [estado]="estadoFiltros" (estadoChange)="alFiltrar($event)"></app-filter-bar>

  <div class="erp-alert erp-alert--danger" role="alert" *ngIf="!cargando && error">
    <i class="material-icons" aria-hidden="true">error</i>
    <div>
      {{ error }}
      <button type="button" appButton="secondary" size="sm" style="margin-left: 12px" (click)="cargar()">Reintentar</button>
    </div>
  </div>

  <app-card padding="sm" class="tabla-card" *ngIf="!error">
    <app-apple-table
      [columnas]="columnas"
      [filas]="visibles"
      clave="id"
      etiqueta="Cruces de deuda"
      almacenamiento="cruces-deuda"
      [cargando]="cargando"
      [unidad]="['cruce', 'cruces']"
      [textoVacio]="cruces.length === 0 ? 'Aún no hay cruces de deuda. Regístralos cuando alguien pague una deuda de otra persona (por ejemplo, quien cubre la cuota de otro).' : 'Ningún cruce coincide con la búsqueda.'"
    >
      <ng-template appCelda="concepto" let-c>
        <span class="concepto">{{ c.concepto }}</span>
        <span class="erp-muted comentario" *ngIf="c.comentarios"> — {{ c.comentarios }}</span>
      </ng-template>
    </app-apple-table>
  </app-card>
</section>

<app-modal [modalId]="modalId">
  <app-formulario-cruce *ngIf="formularioAbierto" (creado)="onCreado()" (cancelar)="cerrarFormulario()"></app-formulario-cruce>
</app-modal>
