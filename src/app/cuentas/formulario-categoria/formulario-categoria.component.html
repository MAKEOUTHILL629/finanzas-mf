<form class="erp-form" [formGroup]="form" (ngSubmit)="enviar()" novalidate aria-labelledby="titulo-form-categoria">
  <h2 class="erp-form-title" id="titulo-form-categoria">{{ esEdicion ? 'Editar categoría' : 'Nueva categoría' }}</h2>

  <div class="erp-alert erp-alert--danger" role="alert" *ngIf="errorServidor">
    <i class="material-icons" aria-hidden="true">error</i>
    <span>{{ errorServidor }}</span>
  </div>
  <div class="erp-alert erp-alert--info" role="status" *ngIf="sinCambios">
    <i class="material-icons" aria-hidden="true">info</i>
    <span>No hay cambios para guardar.</span>
  </div>

  <div class="erp-form-grid">
    <div class="erp-field erp-span-2">
      <label class="erp-label" for="ca-nombre">Nombre<span class="erp-req" aria-hidden="true">*</span></label>
      <input id="ca-nombre" appInput type="text" formControlName="nombre" maxlength="80" autocomplete="off" placeholder="Ej. Alimentación" [attr.aria-invalid]="campoInvalido('nombre')" />
      <p class="erp-field-error" *ngIf="campoInvalido('nombre')">Escribe un nombre.</p>
    </div>

    <div class="erp-field">
      <label class="erp-label" for="ca-tipo">Tipo<span class="erp-req" aria-hidden="true">*</span></label>
      <select id="ca-tipo" appInput formControlName="tipo">
        <option *ngFor="let t of tipos" [value]="t.valor">{{ t.etiqueta }}</option>
      </select>
    </div>

    <div class="erp-field">
      <label class="erp-label" for="ca-color">Color</label>
      <input id="ca-color" appInput type="color" formControlName="color" style="padding: 4px; min-height: 44px" />
    </div>
  </div>

  <div class="erp-form-actions">
    <button type="button" appButton="ghost" (click)="cancelar.emit()" [disabled]="enviando">Cancelar</button>
    <button type="submit" appButton="primary" [disabled]="enviando">{{ enviando ? 'Guardando…' : esEdicion ? 'Guardar cambios' : 'Crear categoría' }}</button>
  </div>
</form>
