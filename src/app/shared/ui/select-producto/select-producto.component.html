<app-searchable-select
  [opciones]="opciones" [valor]="valor" [inputId]="inputId" [placeholder]="placeholder" [permitirVacio]="permitirVacio" [invalido]="invalido"
  placeholderBusqueda="Buscar por nombre, *1927, crédito, débito…"
  [ariaLabel]="ariaLabel" [ariaDescribedby]="ariaDescribedby" [cargando]="cargandoSinDatos" [deshabilitado]="deshabilitado || (sinOpciones && !valor)"
  (elegido)="alElegir($event)" (tocado)="alSalir()"></app-searchable-select>

<p class="erp-field-error sp-aviso" *ngIf="error" role="alert">
  {{ error }}
  <button type="button" class="sp-enlace" (click)="reintentar()">Reintentar</button>
</p>
<p class="erp-field-hint sp-aviso" *ngIf="sinOpciones && !error && cargado">
  No hay tarjetas ni cuentas registradas.
  <a *ngIf="enlaceCrear" class="sp-enlace" [routerLink]="enlaceCrear.ruta">{{ enlaceCrear.texto }}</a>
</p>
