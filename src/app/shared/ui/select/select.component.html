<app-searchable-select
  [opciones]="opcionesVisibles" [valor]="valor" [inputId]="inputId" [placeholder]="placeholder" [permitirVacio]="permitirVacio" [invalido]="invalido"
  [ariaLabel]="ariaLabel" [ariaDescribedby]="ariaDescribedby" [abrirAlMostrar]="abrirAlMostrar" [cargando]="cargandoSinDatos" [deshabilitado]="deshabilitado || (sinOpciones && !valor)"
  (elegido)="alElegir($event)" (tocado)="alSalir()"></app-searchable-select>

<p class="erp-field-error ui-select-error" *ngIf="error" role="alert">
  {{ error }}
  <button type="button" class="ui-select-enlace" (click)="reintentar()">Reintentar</button>
</p>
<p class="erp-field-hint ui-select-vacio" *ngIf="sinOpciones && !error && (!catalogo || (estado && estado.cargado))">
  {{ mensajeVacio }}
  <a *ngIf="enlaceCrear" class="ui-select-enlace" [routerLink]="enlaceCrear.ruta">{{ enlaceCrear.texto }}</a>
</p>
