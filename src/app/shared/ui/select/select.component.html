<div class="ui-select" [class.ui-select--cargando]="cargandoSinDatos" [class.ui-select--invalido]="invalido">
  <select #campo appInput [id]="inputId" [disabled]="deshabilitado || cargandoSinDatos || (sinOpciones && !valor)" [attr.aria-invalid]="invalido ? 'true' : null" [attr.aria-label]="ariaLabel" [attr.aria-describedby]="ariaDescribedby" [attr.aria-busy]="cargandoSinDatos ? 'true' : null" (change)="alCambiar($event)" (blur)="alSalir()">
    <ng-container *ngIf="cargandoSinDatos; else listo">
      <option value="" selected>{{ catalogo ? 'Cargando…' : placeholder }}</option>
    </ng-container>
    <ng-template #listo>
      <option value="" [selected]="valor === null" [disabled]="!permitirVacio && opcionesVisibles.length > 0">{{ sinOpciones ? 'Sin opciones' : placeholder }}</option>
      <option *ngFor="let o of opcionesVisibles; trackBy: trackOpcion" [value]="o.valor" [selected]="esSeleccionada(o)" [disabled]="o.deshabilitada">{{ o.etiqueta }}</option>
    </ng-template>
  </select>
  <span class="ui-select-esqueleto erp-skeleton" *ngIf="cargandoSinDatos" aria-hidden="true"></span>
</div>

<p class="erp-field-error ui-select-error" *ngIf="error" role="alert">
  {{ error }}
  <button type="button" class="ui-select-enlace" (click)="reintentar()">Reintentar</button>
</p>
<p class="erp-field-hint ui-select-vacio" *ngIf="sinOpciones && !error && (!catalogo || (estado && estado.cargado))">
  {{ mensajeVacio }}
  <a *ngIf="enlaceCrear" class="ui-select-enlace" [routerLink]="enlaceCrear.ruta">{{ enlaceCrear.texto }}</a>
</p>
