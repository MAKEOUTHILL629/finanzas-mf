<!-- Toggle Button - Solo visible cuando el menú está cerrado -->
<button class="menu-toggle-floating" *ngIf="!isMenuOpen" (click)="toggleMenu()" aria-label="Abrir menú">
  <i class="material-icons">menu</i>
</button>

<nav class="finance-menu" [class.open]="isMenuOpen">

  <div class="menu-header">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="40" height="40" class="logo">
      <circle cx="50" cy="50" r="45" fill="#1976d2" />
      <path d="M50 25v50M25 50h50" stroke="white" stroke-width="8" stroke-linecap="round" />
      <path d="M35 35l30 30M35 65l30-30" stroke="white" stroke-width="6" stroke-linecap="round" />
    </svg>
    <h1>Finanzas Make</h1>

    <!-- Toggle integrado en el header cuando está abierto -->
    <button class="menu-toggle-integrated" (click)="toggleMenu()" aria-label="Cerrar menú">
      <i class="material-icons">close</i>
    </button>
  </div>

  <ul class="menu-items">
    <!-- Items de navegación -->
    <ng-container *ngIf="isUserLoggedIn$ | async">
      <li *ngFor="let item of loggedInMenuItems"
          routerLinkActive="active"
          (click)="isMobile && toggleMenu()"
          [title]="item.label">
        <a [routerLink]="item.route">
          <i class="material-icons" *ngIf="item.icon">{{item.icon}}</i>
          <span class="menu-label">{{item.label}}</span>
        </a>
      </li>
    </ng-container>

    <li *ngIf="!(isUserLoggedIn$ | async)"
        routerLinkActive="active"
        (click)="isMobile && toggleMenu()"
        title="Iniciar Sesión">
      <a routerLink="/login">
        <i class="material-icons">login</i>
        <span class="menu-label">Iniciar Sesión</span>
      </a>
    </li>
  </ul>

  <!-- Logout al final -->
  <div class="menu-footer" *ngIf="isUserLoggedIn$ | async">
    <button
      type="button"
      class="menu-item-theme"
      (click)="toggleTheme()"
      [title]="isDarkTheme ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
    >
      <i class="material-icons">{{ isDarkTheme ? 'light_mode' : 'dark_mode' }}</i>
      <span class="menu-label">{{ isDarkTheme ? 'Tema Claro' : 'Tema Oscuro' }}</span>
    </button>
    <button type="button" class="menu-item-logout" (click)="logout()" title="Cerrar Sesión">
      <i class="material-icons">logout</i>
      <span class="menu-label">Cerrar Sesión</span>
    </button>
  </div>

  <!-- Toggle de tema cuando NO está logueado (visible en pantalla de login) -->
  <div class="menu-footer-guest" *ngIf="!(isUserLoggedIn$ | async)">
    <button
      type="button"
      class="menu-item-theme"
      (click)="toggleTheme()"
      [title]="isDarkTheme ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
    >
      <i class="material-icons">{{ isDarkTheme ? 'light_mode' : 'dark_mode' }}</i>
      <span class="menu-label">{{ isDarkTheme ? 'Tema Claro' : 'Tema Oscuro' }}</span>
    </button>
  </div>

  </nav>

<div class="menu-backdrop" [class.visible]="isMenuOpen && isMobile" (click)="toggleMenu()"></div>
