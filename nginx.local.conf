events {
    worker_connections 1024;
}

# Configuración para ejecutar el frontend en Docker junto a la API NestJS (docker-compose.local.yml).
# Sirve la SPA y reenvía /api/* a la API: el navegador ve un solo origen (igual que detrás de CloudFront), sin CORS.
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # CSV de compras a crédito (POST /api/compras-credito/upload-csv)
        client_max_body_size 20m;

        # DNS interno de Docker. Con `proxy_pass $variable` nginx vuelve a resolver `api` cada 5 s: si la API se
        # reconstruye (otro contenedor, otra IP) el proxy la encuentra sin reiniciar el frontend.
        resolver 127.0.0.11 valid=5s ipv6=off;

        location /api/ {
            set $api_upstream http://api:9000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # actualizar-tasas recorre sitios bancarios con pausas
            proxy_read_timeout 120s;
        }

        # Single Page Application
        location / {
            try_files $uri $uri/ /index.html;
        }

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Los bundles llevan hash en el nombre: cache largo (index.html no entra en esta regla)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
